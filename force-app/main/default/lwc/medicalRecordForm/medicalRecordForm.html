<template>
    <lightning-card title="New Medical Record">
        <lightning-textarea label="Diagnosis" name="diagnosis" value={diagnosis} onchange={handleChange}></lightning-textarea>
        <lightning-textarea label="Prescription" name="prescription" value={prescription} onchange={handleChange}></lightning-textarea>
        <lightning-input label="Blood Pressure" name="bp" value={bp} onchange={handleChange}></lightning-input>
        <lightning-input type="number" label="Temperature (F)" name="temperature" value={temperature} onchange={handleChange}></lightning-input>
        <lightning-input type="number" label="Weight (kg)" name="weight" value={weight} onchange={handleChange}></lightning-input>
        <lightning-input type="date" label="Follow-Up Date" name="followUpDate" value={followUpDate} onchange={handleChange}></lightning-input>
        <lightning-combobox label="Status" name="status" options={statusOptions} value={status} onchange={handleChange}></lightning-combobox>
        <lightning-button label="Save Medical Record" variant="brand" onclick={saveRecord}></lightning-button>
    </lightning-card>
</template>
